pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "{src,__tests__,config}/**/*.{ts,tsx,json}"
      run: npx biome check --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: tests
      run: npm run test